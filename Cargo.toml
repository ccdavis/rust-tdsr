[package]
name = "tdsr"
version = "0.1.0"
authors = ["Tyler Spivey <tspivey@pcdesk.net>"]
edition = "2021"
rust-version = "1.70"
description = "A console-based screen reader for *nix systems"
license = "GPL-3.0-or-later"
repository = "https://github.com/tspivey/tdsr"
keywords = ["accessibility", "screen-reader", "terminal", "tts"]
categories = ["accessibility", "command-line-utilities"]

[[bin]]
name = "tdsr"
path = "src/main.rs"

[features]
# The `native-speech` feature pulls in the `tts` crate (Speech Dispatcher on
# Linux). It is on by default. Build with `--no-default-features` to omit it,
# e.g. on distros whose speech-dispatcher is too old to compile (Ubuntu 20.04);
# such builds use the PulseAudio + espeak-ng backend on Linux.
default = ["native-speech"]
native-speech = ["dep:tts"]

[dependencies]
# Terminal emulation
vte = "0.13"
portable-pty = "0.8"

# Unicode and text processing
unicode-width = "0.2"
regex = "1.10"

# Configuration
rust-ini = "0.21"

# I/O and event handling
mio = { version = "1.0", features = ["os-poll", "os-ext"] }
nix = { version = "0.29", features = ["term", "signal", "ioctl", "process", "fs", "poll"] }

# Clipboard
arboard = { version = "3.4", features = ["wayland-data-control"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization (for plugin system and config)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lazy static initialization
once_cell = "1.19"

# Directory utilities
dirs = "5.0"

# Platform-specific dependencies

# Text-to-speech via the `tts` crate (Speech Dispatcher on Linux and other
# Unixes). Optional: enabling it requires libspeechd-dev >= 0.10 at build time.
# Disable with --no-default-features on older distros (e.g. Ubuntu 20.04, which
# ships speech-dispatcher 0.9.1) to build an espeak-ng-only binary.
#
# Not used on macOS: the in-process AVFoundation path only plays the first
# utterance because the main thread never services a CFRunLoop. macOS uses the
# speech-server subprocess in speech/backends/avfoundation.rs exclusively.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tts = { version = "0.26", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# AVFoundation speech server (see speech/backends/avfoundation.rs): the binary
# re-execs itself as `tdsr --speech-server` and drives AVSpeechSynthesizer on
# that child's main thread with a real CFRunLoop.
objc = "0.2"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[lints.rust]
# The `objc` 0.2 macros expand `#[cfg(feature = "cargo-clippy")]` into this
# crate; declare that value so clippy doesn't warn on every msg_send!.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
